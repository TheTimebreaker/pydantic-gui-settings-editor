name: Automatically run pytest tests

on:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "test*"
  pull_request:

concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
        resolution: ["highest", "lowest"]

    name: Python ${{ matrix.python-version }} / ${{ matrix.resolution }} dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install UV
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        if: matrix.resolution == 'highest'
        run: uv sync --dev

      - name: Install minimum dependencies
        if: matrix.resolution == 'lowest'
        run: uv sync --dev --resolution lowest-direct

      - name: Install system dependencies # Will crash Qt otherwise
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 shellcheck

      - name: Run pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest

      - name: Run ruff
        run: uv run ruff check .

      - name: Run black
        run: uv run black --check .

      - name: Run mypy
        run: uv run mypy .

      - name: Run jactionlint
        run: uv run jactionlint


  tests-passed:
    name: All tests passed
    if: ${{ !cancelled() }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {}

    steps:
      - run: |
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "One or more test matrix jobs failed."
            exit 1
          fi