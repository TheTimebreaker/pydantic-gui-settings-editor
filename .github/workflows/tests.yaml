name: Automatically run pytest tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        resolution: ["highest", "lowest"]

    name: Python ${{ matrix.python-version }} / ${{ matrix.resolution }} dependencies

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install UV
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        if: matrix.resolution == 'highest'
        run: uv sync

      - name: Install minimum dependencies
        if: matrix.resolution == 'lowest'
        run: uv sync --resolution lowest-direct

      - name: Install system dependencies # Will crash Qt otherwise
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest


  tests-passed:
    name: All tests passed
    if: ${{ !cancelled() }}
    needs: test
    runs-on: ubuntu-latest

    steps:
      - run: |
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "One or more test matrix jobs failed."
            exit 1
          fi